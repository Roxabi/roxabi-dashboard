name: CI

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  NODE_VERSION: "22"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  # Processed PR merge → skip suite. Naked push → run suite.
  # ~/projects/ssot/conventions.ssot.md § CI landing
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
          n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)] | length')"
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)][0].head.sha')"
            conc="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select((.name | ascii_downcase) == "ci") | .conclusion] | map(select(. == "success")) | if length > 0 then "success" else "missing" end')"
            if [ "$conc" = "success" ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  ci:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check file length
        run: bash tools/check_file_length.sh

      - name: Check folder size
        run: bash tools/check_folder_size.sh

      - name: Lint tools
        run: uv run ruff check tools

      - name: License check
        run: uv run tools/license_check.py

  api:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      - name: Assert E2E_TEST_MODE not in apps/api/wrangler.toml
        run: |
          if grep -E '^\s*E2E_TEST_MODE\s*=' apps/api/wrangler.toml; then
            echo "E2E_TEST_MODE must not be committed (local Playwright only)"
            exit 1
          fi
      - name: Lint + format (Biome — api + app)
        run: bunx biome ci apps/api/src apps/app/src
      - name: Typecheck (api)
        run: bun --filter @roxabi-live/api typecheck
      - name: Test (api — vitest)
        run: bun --filter @roxabi-live/api test

  app:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      - name: Typecheck (shared + app)
        run: |
          bun --filter @roxabi-live/shared typecheck
          bun --filter @roxabi-live/app typecheck
      - name: Test (shared — vitest)
        run: bun --filter @roxabi-live/shared test
      - name: Test (app — vitest)
        run: bun --filter @roxabi-live/app test
      # Marketing: gate on a successful Astro build (astro check has pre-existing
      # i18n literal-type debt — tracked separately, not a cutover regression).
      - name: Build (marketing — astro)
        run: bun --filter @roxabi-live/marketing build

  plugin:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install plugin deps
        run: cd plugins/roxabi-issues && bun install --frozen-lockfile
      - name: Typecheck (tsc)
        run: cd plugins/roxabi-issues && bun run typecheck
      - name: Test (vitest)
        run: cd plugins/roxabi-issues && bun run test

  # Legacy frontend/ (vanilla JS) is now ASSETS-only fallback on the api worker;
  # the cockpit is apps/app (covered by the `app` job). Its retirement removes the
  # old `frontend` CI job. frontend/ itself is deleted once the cutover is live.

  # Deploy: Cloudflare Workers Builds (git-connected). See infra/workers-builds.json.
  # CI runs quality gates only — no wrangler deploy here (enishu model).
